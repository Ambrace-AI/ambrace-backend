name: Deploy Development

# Manual: run from master or an Ambrace-* branch with PLAN or APPLY. The
# `development` GitHub Environment refuses any other branch.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: "PLAN shows what would change. APPLY deploys."
        required: true
        type: choice
        default: "PLAN"
        options:
          - PLAN
          - APPLY

  # ---------------------------------------------------------------------------
  # TEMPORARY - REMOVE BEFORE MERGING TO MASTER.
  # A manually triggered workflow cannot be started until its file is on the
  # default branch, so this push trigger exists only to prove the pipeline (and
  # the GitHub -> AWS trust) from the feature branch. Every push to this one
  # branch plans AND applies to the dev account.
  # ---------------------------------------------------------------------------
  push:
    branches:
      - Ambrace-33-port-backend

permissions:
  contents: read

# One dev deployment at a time; a newer run waits rather than cancelling one
# that is mid-apply.
concurrency:
  group: ambrace-dev-deployment
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/_deploy.yml
    permissions:
      contents: read
      id-token: write
    with:
      github_environment: development
      tf_environment: dev
      # TEMPORARY: `github.event_name == 'push'` goes away with the push trigger.
      apply: ${{ github.event_name == 'push' || inputs.operation == 'APPLY' }}
